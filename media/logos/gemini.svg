<svg viewBox="0 0 296 298" width="296" height="298" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base smooth gradient: Deep Blue -> Indigo -> Purple -> Coral -> Crimson -->
    <linearGradient id="gemini-base" x1="0.1" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="30%" stop-color="#7B61FF" />
      <stop offset="60%" stop-color="#9B72CF" />
      <stop offset="85%" stop-color="#E25555" />
      <stop offset="100%" stop-color="#EA4335" />
    </linearGradient>

    <!-- Warm Amber highlight on the left wing -->
    <radialGradient id="gemini-amber" cx="15%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F6C013" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F6C013" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F6C013" stop-opacity="0" />
    </radialGradient>

    <!-- Vibrant Cyan/Sky Blue highlight on the top-right wing -->
    <radialGradient id="gemini-cyan" cx="80%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#24C6DC" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3689FF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#3689FF" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Green glow on the bottom wing -->
    <radialGradient id="gemini-green" cx="60%" cy="85%" r="35%">
      <stop offset="0%" stop-color="#14BB69" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#14BB69" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14BB69" stop-opacity="0" />
    </radialGradient>

    <!-- Center luminous core glow -->
    <radialGradient id="gemini-core" cx="48%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#9B72CF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#9B72CF" stop-opacity="0" />
    </radialGradient>

    <clipPath id="gemini-clip">
      <path d="M141.201 4.886c2.282-6.17 11.042-6.071 13.184.148l5.985 17.37a184.004 184.004 0 0 0 111.257 113.049l19.304 6.997c6.143 2.227 6.156 10.91.02 13.155l-19.35 7.082a184.001 184.001 0 0 0-109.495 109.385l-7.573 20.629c-2.241 6.105-10.869 6.121-13.133.025l-7.908-21.296a184 184 0 0 0-109.02-108.658l-19.698-7.239c-6.102-2.243-6.118-10.867-.025-13.132l20.083-7.467A183.998 183.998 0 0 0 133.291 26.28l7.91-21.394Z" />
    </clipPath>
  </defs>

  <!-- Render with clipPath -->
  <g clip-path="url(#gemini-clip)">
    <rect x="0" y="0" width="296" height="298" fill="url(#gemini-base)" />
    <rect x="0" y="0" width="296" height="298" fill="url(#gemini-amber)" />
    <rect x="0" y="0" width="296" height="298" fill="url(#gemini-cyan)" />
    <rect x="0" y="0" width="296" height="298" fill="url(#gemini-green)" />
    <rect x="0" y="0" width="296" height="298" fill="url(#gemini-core)" />
  </g>
</svg>